<!DOCTYPE html>

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',

    <style>
        /* Custom map pin glow and animation */
        .custom-div-icon {
            background: transparent;
            border: none;
        }
        .marker-pin {
            width: 36px;
            height: 36px;
            border-radius: 50% 50% 50% 0;
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -18px 0 0 -18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: all 0.3s ease;
        }
        .marker-pin i {
            transform: rotate(45deg);
            font-size: 16px;
            color: #ffffff;
        }
        .marker-pin:hover {
            transform: rotate(-45deg) scale(1.15);
            z-index: 999;
        }

        /* Leaflet Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 1rem;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
        }
        .leaflet-popup-content {
            margin: 0 !important;
            line-height: 1.5;
        }
        .leaflet-container {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Mobile Sheet Animation */
        .bottom-sheet-enter {
            transform: translateY(100%);
        }
        .bottom-sheet-show {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Header Navigation -->

                </div>

                    <h1 class="text-lg font-bold text-slate-900 leading-tight">臺灣旅圖 <span class="text-xs font-normal text-brand-600 bg-brand-50 px-2 py-0.5 rounded-full border border-brand-200">Interactive Map</span></h1>

            </div>

            <!-- Desktop Search & Quick Actions -->
            <div class="hidden md:flex items-center space-x-4">
                <div class="relative w-64">
                    <input type="text" id="desktopSearchInput" oninput="handleSearch(this.value)" placeholder="搜尋景點、城市、關鍵字..."

                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                </div>

                <button onclick="toggleItineraryDrawer()" class="relative flex items-center space-x-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-route text-brand-600"></i>
                    <span>行程清單</span>
                    <span id="itineraryBadge" class="bg-brand-600 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
                </button>

                <button onclick="toggleFavoriteFilter()" id="favFilterBtn" class="flex items-center space-x-2 bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-700 px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-heart text-red-500"></i>
                    <span>收藏景點</span>
                </button>
            </div>

            <!-- Mobile Quick Buttons -->
            <div class="flex md:hidden items-center space-x-2">
                <button onclick="toggleItineraryDrawer()" class="p-2 text-slate-600 hover:text-brand-600 rounded-lg bg-slate-100 relative">
                    <i class="fa-solid fa-route text-lg"></i>
                    <span id="mobileItineraryBadge" class="absolute -top-1 -right-1 bg-brand-600 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center hidden">0</span>
                </button>
                <button onclick="toggleMobileSearch()" class="p-2 text-slate-600 hover:text-brand-600 rounded-lg bg-slate-100">
                    <i class="fa-solid fa-magnifying-glass text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Search Dropdown Container -->
        <div id="mobileSearchContainer" class="hidden md:hidden px-4 pb-3 pt-1 bg-white border-t border-slate-100">
            <div class="relative">
                <input type="text" id="mobileSearchInput" oninput="handleSearch(this.value)" placeholder="搜尋景點、城市、關鍵字..." 
                       class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex relative overflow-hidden">

        <aside id="sidebar" class="w-full md:w-[380px] lg:w-[420px] bg-white border-r border-slate-200 flex flex-col z-20 transition-all duration-300 absolute md:relative inset-y-0 left-0 -translate-x-full md:translate-x-0">
            
            <!-- Filter Header Controls -->
            <div class="p-4 border-b border-slate-100 bg-slate-50/50 space-y-3">

                        <button onclick="setCategory('food')" class="cat-btn px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 transition"><i class="fa-solid fa-utensils text-orange-500 mr-1"></i>美食夜市</button>
                        <button onclick="setCategory('urban')" class="cat-btn px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 transition"><i class="fa-solid fa-city text-purple-600 mr-1"></i>都市地標</button>

                <!-- Active Filter summary / Result count -->

            </div>
            
            <!-- Close Sidebar Button on Mobile -->

        </aside>

        <!-- Interactive Leaflet Map Container -->

                </button>

            <!-- Mobile Bottom Switcher Button -->

                </div>
            </div>
        </div>
    </div>

        let map;
        let markersGroup;
        let currentRegion = 'all';
        let currentCategory = 'all';
        let searchQuery = '';
        let showFavoritesOnly = false;
        
        // Persistent user state stored in localStorage
        let favorites = JSON.parse(localStorage.getItem('taiwan_favs') || '[]');
        let itinerary = JSON.parse(localStorage.getItem('taiwan_itinerary') || '[]');

        // Category Icon and Color Mapping
        const categoryConfig = {
            nature: { icon: 'fa-tree', color: '#22c55e', name: '自然美景' },
            culture: { icon: 'fa-landmark', color: '#d97706', name: '歷史古蹟' },
            food: { icon: 'fa-utensils', color: '#f97316', name: '美食夜市' },
            urban: { icon: 'fa-city', color: '#9333ea', name: '都市地標' }
        };

        // Window Load Initialization
        window.onload = function() {
            initMap();
            renderAttractionsList();
            updateBadges();
        };

        function initMap() {
            // Taiwan Centered View
            map = L.map('map', {
                zoomControl: false
            }).setView([23.7, 120.95], 7.5);

            // Primary: CartoDB Voyager tiles. If they fail to load (blocked by an
            // extension / network), fall back to standard OpenStreetMap tiles.
            const cartoLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            let tileErrors = 0;
            cartoLayer.on('tileerror', () => {
                if (++tileErrors !== 3) return;
                map.removeLayer(cartoLayer);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    maxZoom: 19
                }).addTo(map);
            });

            // Re-add Zoom Control at bottom right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);
            renderMapMarkers();
        }

        function renderMapMarkers() {
            markersGroup.clearLayers();

            const filteredData = getFilteredAttractions();

            filteredData.forEach(item => {
                const cfg = categoryConfig[item.category] || { icon: 'fa-location-dot', color: '#3b82f6' };
                
                // Custom Colored Pin Marker
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="marker-pin" style="background-color: ${cfg.color};">
                             <i class="fa-solid ${cfg.icon}"></i>
                           </div>`,
                    iconSize: [36, 36],
                    iconAnchor: [18, 36],
                    popupAnchor: [0, -32]
                });

                const marker = L.marker([item.lat, item.lng], { icon: customIcon });

                // Leaflet Custom Popup Content
                const popupHtml = `
                    <div class="w-64 bg-white rounded-xl overflow-hidden shadow-sm">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-28 object-cover">
                        <div class="p-3">
                            <div class="flex items-center justify-between text-xs text-slate-500 mb-1">
                                <span>${item.county}</span>
                                <span class="text-amber-500 font-bold"><i class="fa-solid fa-star mr-0.5"></i>${item.rating}</span>
                            </div>
                            <h4 class="font-bold text-slate-800 text-sm mb-2 leading-tight">${item.name}</h4>
                            <div class="flex space-x-1">
                                <button onclick="openModal('${item.id}')" class="flex-1 py-1.5 bg-brand-600 text-white rounded-md text-xs font-medium hover:bg-brand-700 transition">
                                    詳細資訊
                                </button>
                                <button onclick="toggleItinerary('${item.id}')" class="p-1.5 border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-md text-xs">
                                    <i class="fa-solid ${isInItinerary(item.id) ? 'fa-check text-brand-600' : 'fa-plus'}"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupHtml);
                markersGroup.addLayer(marker);
            });
        }

        function getFilteredAttractions() {
            return attractionsData.filter(item => {
                const matchRegion = currentRegion === 'all' || item.region === currentRegion;
                const matchCat = currentCategory === 'all' || item.category === currentCategory;
                const matchQuery = searchQuery === '' || 
                    item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    item.county.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    item.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
                const matchFav = !showFavoritesOnly || favorites.includes(item.id);

                return matchRegion && matchCat && matchQuery && matchFav;
            });
        }

        function renderAttractionsList() {
            const container = document.getElementById('attractionsList');
            const filtered = getFilteredAttractions();

            document.getElementById('attractionCount').innerText = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-compass text-4xl mb-3 text-slate-300"></i>
                        <p class="text-sm font-medium">沒有找到符合條件的景點</p>
                        <button onclick="resetFilters()" class="mt-2 text-xs text-brand-600 font-semibold underline">清除所有篩選條件</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isFav = favorites.includes(item.id);
                const inPlan = isInItinerary(item.id);
                const cfg = categoryConfig[item.category];

                return `
                    <div class="pt-3 first:pt-0">
                        <div class="bg-white hover:border-brand-500 border border-slate-200/80 rounded-xl p-3 transition-all duration-200 hover:shadow-md group cursor-pointer" onclick="focusOnAttraction('${item.id}')">
                            <div class="flex space-x-3">
                                <img src="${item.image}" alt="${item.name}" class="w-24 h-24 rounded-lg object-cover flex-shrink-0 group-hover:scale-105 transition-transform duration-300">
                                
                                <div class="flex-1 min-w-0 flex flex-col justify-between">
                                    <div>
                                        <div class="flex items-center justify-between mb-1">
                                            <span class="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">${item.county}</span>
                                            <button onclick="event.stopPropagation(); toggleFavorite('${item.id}')" class="text-slate-300 hover:text-red-500 transition">
                                                <i class="fa-${isFav ? 'solid text-red-500' : 'regular'} fa-heart text-base"></i>
                                            </button>
                                        </div>
                                        <h3 class="font-bold text-slate-800 text-sm truncate group-hover:text-brand-600 transition">${item.name}</h3>
                                        <p class="text-xs text-slate-500 line-clamp-1 mt-0.5">${item.description}</p>
                                    </div>

                                    <div class="flex items-center justify-between pt-2 text-xs">
                                        <span class="text-amber-500 font-bold"><i class="fa-solid fa-star mr-1 text-[10px]"></i>${item.rating}</span>
                                        <div class="flex space-x-1" onclick="event.stopPropagation()">
                                            <button onclick="toggleItinerary('${item.id}')" class="px-2 py-1 rounded-md text-[11px] font-medium transition ${inPlan ? 'bg-brand-50 text-brand-700 border border-brand-200' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                                <i class="fa-solid ${inPlan ? 'fa-check' : 'fa-plus'} mr-1"></i>${inPlan ? '已加入' : '行程'}
                                            </button>
                                            <button onclick="openModal('${item.id}')" class="px-2 py-1 bg-slate-800 text-white hover:bg-slate-900 rounded-md text-[11px] font-medium transition">
                                                詳情
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function focusOnAttraction(id) {
            const item = attractionsData.find(a => a.id === id);
            if (!item) return;

            map.flyTo([item.lat, item.lng], 13, { duration: 1.2 });

            // On mobile screen, close the drawer when clicking an item
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }

            // Open Popup
            markersGroup.eachLayer(layer => {
                const latlng = layer.getLatLng();
                if (Math.abs(latlng.lat - item.lat) < 0.0001 && Math.abs(latlng.lng - item.lng) < 0.0001) {
                    layer.openPopup();
                }
            });
        }

        function setRegion(region) {
            currentRegion = region;
            
            // Highlight Button
            document.querySelectorAll('#regionFilters button').forEach(btn => {
                btn.className = 'region-btn py-1.5 bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 rounded-md text-center transition';
            });
            event.target.className = 'region-btn active py-1.5 rounded-md text-center transition bg-brand-600 text-white font-semibold';

            // Pan Map to region centers
            const regionCoordinates = {
                north: [25.04, 121.55, 9.5],
                central: [23.95, 120.90, 9.5],
                south: [22.75, 120.30, 9],
                east: [23.80, 121.40, 8.5],
                islands: [23.50, 119.60, 8]
            };

            if (regionCoordinates[region]) {
                const [lat, lng, zoom] = regionCoordinates[region];
                map.flyTo([lat, lng], zoom);
            } else {
                resetMapView();
            }

            renderMapMarkers();
            renderAttractionsList();
        }

        function setCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('#categoryFilters button').forEach(btn => {
                btn.className = 'cat-btn px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 transition';
            });
            event.currentTarget.className = 'cat-btn active px-2.5 py-1 rounded-full bg-slate-800 text-white transition';

            renderMapMarkers();
            renderAttractionsList();
        }

        function handleSearch(val) {
            searchQuery = val;
            renderMapMarkers();
            renderAttractionsList();
        }

        function toggleFavoriteFilter() {
            showFavoritesOnly = !showFavoritesOnly;
            const btn = document.getElementById('favFilterBtn');
            if (showFavoritesOnly) {
                btn.classList.add('bg-red-50', 'text-red-600', 'border', 'border-red-200');
                showToast('已切換為「僅顯示收藏景點」', 'fa-heart');
            } else {
                btn.classList.remove('bg-red-50', 'text-red-600', 'border', 'border-red-200');
            }
            renderMapMarkers();
            renderAttractionsList();
        }

        function resetFilters() {
            currentRegion = 'all';
            currentCategory = 'all';
            searchQuery = '';
            showFavoritesOnly = false;
            document.getElementById('desktopSearchInput').value = '';
            document.getElementById('mobileSearchInput').value = '';
            
            setRegion('all');
            renderMapMarkers();
            renderAttractionsList();
            resetMapView();
        }

        function resetMapView() {
            map.flyTo([23.7, 120.95], 7.5);
        }

        function locateUser() {
            if (!navigator.geolocation) {
                showToast('您的瀏覽器不支援定位功能', 'fa-triangle-exclamation');
                return;
            }

            showToast('定位中...', 'fa-location-crosshairs');
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                map.flyTo([lat, lng], 13);

                L.marker([lat, lng]).addTo(map)
                    .bindPopup('<b class="text-sm">您的當前位置</b>')
                    .openPopup();

                showToast('已定位至您的位置！', 'fa-location-dot');
            }, () => {
                showToast('無法取得您的位置權限', 'fa-triangle-exclamation');
            });
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
                showToast('已從收藏中移除');
            } else {
                favorites.push(id);
                showToast('已加入收藏！', 'fa-heart');
            }
            localStorage.setItem('taiwan_favs', JSON.stringify(favorites));
            renderAttractionsList();
            
            // If modal is open, update modal bookmark state
            const modalBtn = document.getElementById('modalFavBtn');
            if (modalBtn) updateModalFavButton(id);
        }

        function toggleItinerary(id) {
            if (isInItinerary(id)) {
                itinerary = itinerary.filter(itemId => itemId !== id);
                showToast('已從行程中移除');
            } else {
                itinerary.push(id);
                showToast('已新增至行程規劃！', 'fa-route');
            }
            localStorage.setItem('taiwan_itinerary', JSON.stringify(itinerary));
            updateBadges();
            renderAttractionsList();
            renderMapMarkers();
            renderItineraryDrawer();
        }

        function isInItinerary(id) {
            return itinerary.includes(id);
        }

        function updateBadges() {
            const count = itinerary.length;
            const badge = document.getElementById('itineraryBadge');
            const mobileBadge = document.getElementById('mobileItineraryBadge');

            if (count > 0) {
                badge.innerText = count;
                badge.classList.remove('hidden');
                mobileBadge.innerText = count;
                mobileBadge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
                mobileBadge.classList.add('hidden');
            }
        }

        function openModal(id) {
            const item = attractionsData.find(a => a.id === id);
            if (!item) return;

            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalImage').src = item.image;
            document.getElementById('modalRegionBadge').innerText = item.county;
            document.getElementById('modalCategoryBadge').innerText = categoryConfig[item.category].name;
            document.getElementById('modalRating').innerText = item.rating;
            document.getElementById('modalStayTime').innerText = item.stayTime;
            document.getElementById('modalDescription').innerText = item.description;
            document.getElementById('modalAddress').innerText = item.address;
            document.getElementById('modalHours').innerText = `營業時間: ${item.hours}`;
            document.getElementById('modalNavBtn').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name)}`;

            const itinBtn = document.getElementById('modalItineraryBtn');
            const inPlan = isInItinerary(item.id);
            itinBtn.onclick = () => toggleItinerary(item.id);
            itinBtn.innerHTML = inPlan ? '<i class="fa-solid fa-check"></i><span>已在行程中</span>' : '<i class="fa-solid fa-plus"></i><span>加入行程規劃</span>';
            itinBtn.className = inPlan ? 'flex-1 py-3 bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition flex items-center justify-center space-x-2' : 'flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold shadow-md transition flex items-center justify-center space-x-2';

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function toggleItineraryDrawer() {
            const drawer = document.getElementById('itineraryDrawer');
            drawer.classList.toggle('translate-x-full');
            renderItineraryDrawer();
        }

        function renderItineraryDrawer() {
            const container = document.getElementById('itineraryContent');
            const countText = document.getElementById('itineraryCountText');
            const estTimeText = document.getElementById('itineraryEstTime');

            countText.innerText = itinerary.length;
            estTimeText.innerText = `${itinerary.length * 2} 小時`;

            if (itinerary.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400">
                        <i class="fa-solid fa-map-location-dot text-4xl mb-3 text-slate-300"></i>
                        <p class="text-sm font-medium">尚未添加任何景點</p>
                        <p class="text-xs text-slate-400 mt-1">從景點清單點擊「+ 行程」開始規劃您的寶島之旅</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = itinerary.map((id, index) => {
                const item = attractionsData.find(a => a.id === id);
                if (!item) return '';

                return `
                    <div class="flex items-center space-x-3 bg-slate-50 p-3 rounded-xl border border-slate-200/80">
                        <span class="w-6 h-6 rounded-full bg-brand-600 text-white text-xs font-bold flex items-center justify-center flex-shrink-0">
                            ${index + 1}
                        </span>
                        <img src="${item.image}" alt="${item.name}" class="w-14 h-14 rounded-lg object-cover flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-slate-800 text-xs truncate">${item.name}</h4>
                            <p class="text-[11px] text-slate-500">${item.county}・建議 ${item.stayTime}</p>
                        </div>
                        <button onclick="toggleItinerary('${item.id}')" class="text-slate-400 hover:text-red-500 p-1 transition">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function clearItinerary() {
            if (itinerary.length === 0) return;
            itinerary = [];
            localStorage.setItem('taiwan_itinerary', JSON.stringify([]));
            updateBadges();
            renderAttractionsList();
            renderMapMarkers();
            renderItineraryDrawer();
            showToast('已清空所有行程');
        }

        function exportItinerary() {
            if (itinerary.length === 0) {
                showToast('行程為空，無法分享');
                return;
            }

            const names = itinerary.map((id, idx) => {
                const item = attractionsData.find(a => a.id === id);
                return `${idx + 1}. ${item.name} (${item.county})`;
            }).join('\n');

            const shareText = `🗺️ 我的台灣旅遊行程規劃：\n\n${names}\n\n使用「台灣旅遊景點互動地圖」規劃`;

            // Clipboard copy with iframe safety fallback
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = shareText;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            showToast('行程路線已複製至剪貼簿！', 'fa-copy');
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function toggleMobileSearch() {
            const container = document.getElementById('mobileSearchContainer');
            container.classList.toggle('hidden');
        }

        function showToast(msg, icon = 'fa-circle-check') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            toastIcon.className = `fa-solid ${icon} text-brand-400 text-lg`;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
